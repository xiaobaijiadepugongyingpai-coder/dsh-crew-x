<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <defs>
    <linearGradient id="term-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    .term-text {
      font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      fill: #c9d1d9;
    }
    .prompt { fill: #58a6ff; font-weight: 700; }
    .cmd { fill: #e3b341; }
    .comment { fill: #8b949e; font-style: italic; }
    .success { fill: #3fb950; font-weight: 700; }
    .highlight { fill: #ffa657; font-weight: 700; }
    .purple { fill: #d2a8ff; }
    .cyan { fill: #79c0ff; }
    .dim { fill: #6e7681; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 700; }

    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor { animation: cursorBlink 1s infinite; fill: #58a6ff; }
  </style>

  <!-- Outer Canvas -->
  <rect width="1100" height="560" rx="16" fill="#090d13" />

  <!-- Terminal Frame -->
  <g transform="translate(28, 24)" filter="url(#shadow)">
    <rect width="1044" height="512" rx="12" fill="url(#term-bg)" stroke="#30363d" stroke-width="1.5" />

    <!-- Titlebar -->
    <rect width="1044" height="40" rx="12" fill="#161b22" />
    <rect y="26" width="1044" height="14" fill="#161b22" />
    <line x1="0" y1="40" x2="1044" y2="40" stroke="#30363d" stroke-width="1" />

    <circle cx="22" cy="20" r="6" fill="#ff5f56" />
    <circle cx="42" cy="20" r="6" fill="#ffbd2e" />
    <circle cx="62" cy="20" r="6" fill="#27c93f" />

    <text x="522" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#8b949e" font-weight="600">
      dsh-crew-x · Opt-In Persistent Session Lifecycle (1:1 Forwarding Subagent Binding)
    </text>

    <!-- Turn 1 Card -->
    <g transform="translate(24, 58)">
      <rect width="996" height="126" rx="8" fill="#0d1117" stroke="#21262d" />
      <rect x="12" y="10" width="66" height="20" rx="5" fill="#1f6feb" fill-opacity="0.2" stroke="#388bfd" stroke-opacity="0.5" />
      <text x="45" y="24" text-anchor="middle" class="badge-txt" fill="#79c0ff">TURN 1</text>
      <text x="90" y="24" class="term-text comment">Create persistent session &amp; diagnose root cause</text>

      <text x="16" y="52" class="term-text"><tspan class="prompt">mcp&gt;</tspan> <tspan class="cmd">dsh_run_worker({ task: "Diagnose #104 timeout in src/hub/index.mjs", tier: "pro", </tspan><tspan class="purple">persistent: true</tspan><tspan class="cmd"> })</tspan></text>
      <text x="16" y="76" class="term-text cyan">[hub] Session pool created · sandbox/mode: "workspace-write" · CWD locked</text>
      <text x="16" y="100" class="term-text"><tspan class="success">✓ Settled (3.4s)</tspan> · <tspan class="highlight">session_id: "sess-9b1c-4f8a"</tspan> · <tspan class="dim">turnIndex: 1 · Root cause: missing turnEpoch guard</tspan></text>
    </g>

    <!-- Turn 2 Card -->
    <g transform="translate(24, 200)">
      <rect width="996" height="126" rx="8" fill="#0d1117" stroke="#21262d" />
      <rect x="12" y="10" width="66" height="20" rx="5" fill="#238636" fill-opacity="0.2" stroke="#3fb950" stroke-opacity="0.5" />
      <text x="45" y="24" text-anchor="middle" class="badge-txt" fill="#56d364">TURN 2</text>
      <text x="90" y="24" class="term-text comment">Continue on same session (full tool &amp; reasoning history preserved)</text>

      <text x="16" y="52" class="term-text"><tspan class="prompt">mcp&gt;</tspan> <tspan class="cmd">dsh_run_worker({ </tspan><tspan class="highlight">session_id: "sess-9b1c-4f8a"</tspan><tspan class="cmd">, task: "Apply turnEpoch fix and run tests" })</tspan></text>
      <text x="16" y="76" class="term-text cyan">[hub] Resumed session "sess-9b1c-4f8a" (turnIndex: 2 · preset: "default" inherited · zero re-read)</text>
      <text x="16" y="100" class="term-text"><tspan class="success">✓ Settled (2.1s)</tspan> · <tspan class="cyan">CHANGED: src/hub/index.mjs</tspan> · <tspan class="dim">VERIFIED: 171/171 tests passing</tspan></text>
    </g>

    <!-- Turn 3 Card -->
    <g transform="translate(24, 342)">
      <rect width="996" height="146" rx="8" fill="#0d1117" stroke="#21262d" />
      <rect x="12" y="10" width="66" height="20" rx="5" fill="#9e6a03" fill-opacity="0.22" stroke="#d29922" stroke-opacity="0.5" />
      <text x="45" y="24" text-anchor="middle" class="badge-txt" fill="#e3b341">CLOSE</text>
      <text x="90" y="24" class="term-text comment">Explicit teardown with persistent tombstone protection</text>

      <text x="16" y="52" class="term-text"><tspan class="prompt">mcp&gt;</tspan> <tspan class="cmd">dsh_session_close({ </tspan><tspan class="highlight">session_id: "sess-9b1c-4f8a"</tspan><tspan class="cmd"> })</tspan></text>
      <text x="16" y="76" class="term-text cyan">[hub] Agent handle disposed · CWD lock released · tombstone recorded (re-use returns SESSION_CLOSED)</text>
      <text x="16" y="100" class="term-text"><tspan class="success">✓ Closed:</tspan> <tspan fill="#c9d1d9">{ ok: true, closed: true, session_id: "sess-9b1c-4f8a" }</tspan></text>
      <text x="16" y="128" class="term-text"><tspan class="prompt">mcp&gt;</tspan></text>
      <rect x="60" y="114" width="8" height="17" class="cursor" />
    </g>
  </g>
</svg>
