<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="card-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e161d" />
      <stop offset="100%" stop-color="#130f14" />
    </linearGradient>
    <linearGradient id="card-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11221f" />
      <stop offset="100%" stop-color="#0c1514" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 24px; fill: #f3f4f6; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; fill: #9ca3af; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 16px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
    .metric-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; }
    .metric-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #9ca3af; }
  </style>

  <!-- Background -->
  <rect width="1200" height="580" fill="url(#bg)" rx="16" stroke="#1f2937" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(52, 42)">
    <circle cx="14" cy="14" r="14" fill="#3b82f6" fill-opacity="0.2" />
    <path d="M8 14L12.5 18.5L20 10" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="40" y="21" class="title">Result Management: Unbounded Inline vs Threshold Auto-Offload</text>
    <text x="40" y="43" class="subtitle">Preventing host context overflow during concurrent multi-worker audits (default limit: 1,500 tokens / 4,000 chars)</text>
  </g>

  <!-- Left Card: Unbounded Inline (Red) -->
  <g transform="translate(52, 106)" filter="url(#shadow)">
    <rect width="532" height="432" rx="14" fill="url(#card-red)" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1.5" />

    <rect width="532" height="40" rx="14" fill="#261922" />
    <rect y="26" width="532" height="14" fill="#261922" />
    <circle cx="22" cy="20" r="5" fill="#ef4444" />
    <circle cx="38" cy="20" r="5" fill="#f59e0b" />
    <circle cx="54" cy="20" r="5" fill="#10b981" />
    <text x="72" y="25" class="card-title" fill="#fca5a5">Unbounded Inline Output (Upstream)</text>

    <rect x="20" y="56" width="492" height="278" rx="8" fill="#110d13" stroke="#372733" />
    <g transform="translate(36, 78)">
      <text y="0" class="code" fill="#f87171"># Raw 12,450 tokens injected straight into host chat</text>
      <text y="24" class="code" fill="#9ca3af">Running security scan across 48 modules...</text>
      <text y="44" class="code" fill="#9ca3af">[1/48] src/auth/jwt.ts (1,420 lines scanned)</text>
      <text y="64" class="code" fill="#9ca3af">  Line 124: jwt.verify(token, secret, { algorithms: ['HS256', 'none'] })</text>
      <text y="84" class="code" fill="#9ca3af">[2/48] src/db/client.ts (3,890 lines scanned)</text>
      <text y="104" class="code" fill="#9ca3af">  Full AST dump and raw stack traces...</text>

      <rect x="-8" y="122" width="476" height="106" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-opacity="0.25" rx="6" />
      <text x="8" y="148" class="code" fill="#f87171" font-weight="bold">! 450+ more lines inline (12,450 tokens / 38.2 KB)</text>
      <text x="8" y="170" class="code" fill="#fca5a5">Host context window saturated by verbose tool logs</text>
      <text x="8" y="192" class="code" fill="#f87171">Early compaction triggered -&gt; prior reasoning lost</text>
      <text x="8" y="214" class="code" fill="#fca5a5">Concurrent fan-out impossible without context crash</text>
    </g>

    <rect x="20" y="348" width="492" height="68" rx="8" fill="#23171e" stroke="#4c1d24" />
    <g transform="translate(38, 374)">
      <text y="0" class="metric-val" fill="#ef4444">12,450 tokens</text>
      <text y="18" class="metric-lbl">Pushed to Host Context</text>
    </g>
    <g transform="translate(202, 374)">
      <text y="0" class="metric-val" fill="#f87171">82% Bloat</text>
      <text y="18" class="metric-lbl">Memory Pressure</text>
    </g>
    <g transform="translate(360, 374)">
      <text y="0" class="metric-val" fill="#fca5a5">Ephemeral</text>
      <text y="18" class="metric-lbl">Lost on Compaction</text>
    </g>
  </g>

  <!-- Right Card: dsh-crew-x Auto-Offload (Green) -->
  <g transform="translate(616, 106)" filter="url(#shadow)">
    <rect width="532" height="432" rx="14" fill="url(#card-green)" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.5" />

    <rect width="532" height="40" rx="14" fill="#132b26" />
    <rect y="26" width="532" height="14" fill="#132b26" />
    <circle cx="22" cy="20" r="5" fill="#ef4444" />
    <circle cx="38" cy="20" r="5" fill="#f59e0b" />
    <circle cx="54" cy="20" r="5" fill="#10b981" />
    <text x="72" y="25" class="card-title" fill="#a7f3d0">Threshold Auto-Offload + Contract (dsh-crew-x)</text>

    <rect x="20" y="56" width="492" height="278" rx="8" fill="#0b1715" stroke="#1c3a32" />
    <g transform="translate(36, 78)">
      <text y="0" class="code" fill="#34d399">=== SUMMARY CONTRACT (Parsed &amp; Inlined) ===</text>
      <text y="24" class="code" fill="#6ee7b7" font-weight="bold">VERDICT: PASS WITH FINDINGS (2 issues detected)</text>
      <text y="44" class="code" fill="#a7f3d0">FINDINGS:</text>
      <text y="64" class="code" fill="#e5e7eb">- [HIGH] src/auth/jwt.ts:124 insecure alg whitelist</text>
      <text y="84" class="code" fill="#e5e7eb">- [LOW]  src/db/client.ts:42 uncached client pool</text>
      <text y="104" class="code" fill="#34d399">===========================================</text>

      <rect x="-8" y="122" width="476" height="106" fill="#064e3b" fill-opacity="0.32" stroke="#059669" stroke-width="1" rx="6" />
      <g transform="translate(8, 146)">
        <text y="0" class="code" fill="#10b981" font-weight="bold">[OFFLOADED] Full report saved to disk:</text>
        <text y="22" class="code" fill="#6ee7b7">report_path: .dsh-reports/2026-11-23-sec-audit.md</text>
        <text y="44" class="code" fill="#9ca3af">Size: 48.2 KB (12,450 tokens) · Full details intact</text>
        <text y="66" class="code" fill="#34d399">+ .gitignore entry managed idempotently</text>
      </g>
    </g>

    <rect x="20" y="348" width="492" height="68" rx="8" fill="#132c25" stroke="#065f46" />
    <g transform="translate(38, 374)">
      <text y="0" class="metric-val" fill="#10b981">~380 tokens</text>
      <text y="18" class="metric-lbl">Inline to Host Context</text>
    </g>
    <g transform="translate(202, 374)">
      <text y="0" class="metric-val" fill="#34d399">90%+ Saved</text>
      <text y="18" class="metric-lbl">Context Window Free</text>
    </g>
    <g transform="translate(360, 374)">
      <text y="0" class="metric-val" fill="#6ee7b7">Markdown .md</text>
      <text y="18" class="metric-lbl">Durable Audit File</text>
    </g>
  </g>
</svg>
