<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="card-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1822" />
      <stop offset="100%" stop-color="#141117" />
    </linearGradient>
    <linearGradient id="card-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122322" />
      <stop offset="100%" stop-color="#0e1717" />
    </linearGradient>
    <linearGradient id="badge-red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="badge-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 26px; fill: #f3f4f6; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #9ca3af; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 17px; }
    .card-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 12px; }
    .metric-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; }
    .metric-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #9ca3af; }
  </style>

  <!-- Background -->
  <rect width="1200" height="640" fill="url(#bg)" rx="16" />

  <!-- Header -->
  <g transform="translate(60, 48)">
    <circle cx="14" cy="14" r="14" fill="#3b82f6" fill-opacity="0.2" />
    <path d="M9 14L13 18L19 10" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="40" y="22" class="title">Result Management: Unbounded Inline vs Auto-Offload</text>
    <text x="40" y="44" class="subtitle">How dsh-crew-x prevents host context overflow and token bloat during heavy multi-agent workflows</text>
  </g>

  <!-- Left Card: Upstream (Red) -->
  <g transform="translate(60, 115)" filter="url(#shadow)">
    <rect width="520" height="475" rx="14" fill="url(#card-red)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <rect width="520" height="42" rx="14" fill="#261b24" />
    <rect y="28" width="520" height="14" fill="#261b24" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" />
    <circle cx="56" cy="21" r="5" fill="#10b981" />
    <text x="76" y="26" class="card-title" fill="#fca5a5">Upstream: Unbounded Inline Results</text>

    <!-- Content Body -->
    <rect x="20" y="58" width="480" height="315" rx="8" fill="#110d13" stroke="#372733" />
    
    <g transform="translate(36, 80)">
      <text y="0" class="code" fill="#f87171"># Full 12,450 tokens returned inline to caller</text>
      <text y="24" class="code" fill="#9ca3af">Running comprehensive security scan of all controllers...</text>
      <text y="44" class="code" fill="#9ca3af">[1/48] Scanning src/auth/jwt.ts: AST parsed (1,420 lines)</text>
      <text y="64" class="code" fill="#9ca3af">  Found verification algorithm flexibility issue in verifyToken()</text>
      <text y="84" class="code" fill="#9ca3af">  Line 124: jwt.verify(token, secret, { algorithms: ['HS256', 'none'] })</text>
      <text y="104" class="code" fill="#9ca3af">[2/48] Scanning src/db/client.ts: AST parsed (3,890 lines)</text>
      <text y="124" class="code" fill="#9ca3af">  Stack trace and line-by-line taint analysis report...</text>
      
      <!-- Overflow visual indicator -->
      <rect x="-8" y="140" width="464" height="110" fill="#ef4444" fill-opacity="0.08" rx="6" />
      <text y="165" class="code" fill="#ef4444" font-weight="bold">⚠️ 450+ more lines follow (12,450 tokens / 38,200 chars)</text>
      <text y="185" class="code" fill="#fca5a5">Entire host context consumed by raw terminal text...</text>
      <text y="205" class="code" fill="#f87171">Host context window depleted · Rate limit risks</text>
      <text y="225" class="code" fill="#ef4444">Compaction triggered: conversation history lost!</text>
    </g>

    <!-- Bottom Metric Footer -->
    <rect x="20" y="388" width="480" height="72" rx="8" fill="#23171e" stroke="#4c1d24" />
    <g transform="translate(38, 412)">
      <text y="0" class="metric-val" fill="#ef4444">12,450 tokens</text>
      <text y="18" class="metric-lbl">Pushed into Host Context</text>
    </g>
    <g transform="translate(190, 412)">
      <text y="0" class="metric-val" fill="#f87171">82% Context Bloat</text>
      <text y="18" class="metric-lbl">Memory Pressure</text>
    </g>
    <g transform="translate(350, 412)">
      <text y="0" class="metric-val" fill="#fca5a5">Lost on Compact</text>
      <text y="18" class="metric-lbl">Audit Trail Safety</text>
    </g>
  </g>

  <!-- Right Card: dsh-crew-x (Green) -->
  <g transform="translate(620, 115)" filter="url(#shadow)">
    <rect width="520" height="475" rx="14" fill="url(#card-green)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <rect width="520" height="42" rx="14" fill="#142c27" />
    <rect y="28" width="520" height="14" fill="#142c27" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" />
    <circle cx="56" cy="21" r="5" fill="#10b981" />
    <text x="76" y="26" class="card-title" fill="#a7f3d0">dsh-crew-x: Threshold Offload + Contract</text>

    <!-- Content Body -->
    <rect x="20" y="58" width="480" height="315" rx="8" fill="#0b1715" stroke="#1c3a32" />
    
    <g transform="translate(36, 80)">
      <text y="0" class="code" fill="#34d399">=== SUMMARY CONTRACT (Parsed &amp; Returned) ===</text>
      <text y="24" class="code" fill="#6ee7b7" font-weight="bold">VERDICT: PASS WITH FINDINGS (2 issues detected)</text>
      <text y="44" class="code" fill="#a7f3d0">FINDINGS:</text>
      <text y="64" class="code" fill="#e5e7eb">- [HIGH] src/auth/jwt.ts: Insecure algorithm whitelist</text>
      <text y="84" class="code" fill="#e5e7eb">- [LOW]  src/db/client.ts: Uncached client instance</text>
      <text y="104" class="code" fill="#34d399">=============================================</text>
      
      <!-- Offload Box -->
      <rect x="-8" y="125" width="464" height="125" fill="#064e3b" fill-opacity="0.3" stroke="#059669" stroke-width="1" rx="6" />
      <g transform="translate(10, 148)">
        <text y="0" class="code" fill="#10b981" font-weight="bold">📁 FULL REPORT OFFLOADED TO DISK:</text>
        <text y="22" class="code" fill="#6ee7b7">report_path: .dsh-reports/2026-11-23-sec-audit.md</text>
        <text y="42" class="code" fill="#9ca3af">Size: 48.2 KB (12,450 tokens) &middot; Full report preserved</text>
        <text y="64" class="code" fill="#34d399">✓ Automatically added to .gitignore</text>
        <text y="84" class="code" fill="#a7f3d0">✓ Host context receives compact 380 tokens only</text>
      </g>
    </g>

    <!-- Bottom Metric Footer -->
    <rect x="20" y="388" width="480" height="72" rx="8" fill="#132c25" stroke="#065f46" />
    <g transform="translate(38, 412)">
      <text y="0" class="metric-val" fill="#10b981">380 tokens</text>
      <text y="18" class="metric-lbl">Inline to Host Context</text>
    </g>
    <g transform="translate(190, 412)">
      <text y="0" class="metric-val" fill="#34d399">97% Saved</text>
      <text y="18" class="metric-lbl">Context Window Free</text>
    </g>
    <g transform="translate(350, 412)">
      <text y="0" class="metric-val" fill="#6ee7b7">Permanent .md</text>
      <text y="18" class="metric-lbl">Disk Audit Record</text>
    </g>
  </g>
</svg>
